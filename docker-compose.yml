services:
  backend:
    build:
      context: .
    image: reals-backend:local
    container_name: reals-backend-local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local-firebase
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reals
      SPRING_DATASOURCE_USERNAME: reals
      SPRING_DATASOURCE_PASSWORD: reals
      R2_ENDPOINT: https://abc123def4567890.r2.cloudflarestorage.com
      R2_BUCKET: reals-profile-photos
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_PUBLIC_BASE_URL: ""
    volumes:
      - ./secrets/reals-backend-firebase-credentials-dev.json:/app/secrets/reals-backend-firebase-credentials-dev.json:ro
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16-alpine
    container_name: reals-postgres-local
    environment:
      POSTGRES_DB: reals
      POSTGRES_USER: reals
      POSTGRES_PASSWORD: reals
    ports:
      - "5432:5432"
    volumes:
      - reals-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reals -d reals"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reals-postgres-data:
