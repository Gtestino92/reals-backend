services:
  postgres:
    image: postgres:16-alpine
    container_name: reals-postgres-local
    environment:
      POSTGRES_DB: reals
      POSTGRES_USER: reals
      POSTGRES_PASSWORD: reals
    ports:
      - "5432:5432"
    volumes:
      - reals-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reals -d reals"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reals-postgres-data:
