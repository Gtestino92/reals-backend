services:
  backend:
    build:
      context: .
    image: reals-backend:local
    container_name: reals-backend-local
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: local-firebase
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reals
      SPRING_DATASOURCE_USERNAME: reals
      SPRING_DATASOURCE_PASSWORD: reals
      TZ: UTC
      RATE_LIMIT_ENABLED: "false"
      #RATE_LIMIT_PROVISION_CAPACITY: "1"
      #RATE_LIMIT_PROVISION_REFILL_TOKENS: "1"
      #RATE_LIMIT_PROVISION_REFILL_PERIOD_SECONDS: "60"
      S3_ENDPOINT: http://minio:9000
      S3_PRESIGNED_URL_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_PROFILE_PHOTOS_BUCKET: reals-profile-photos
      S3_ACCESS_KEY_ID: reals
      S3_SECRET_ACCESS_KEY: reals-password
      S3_READ_URL_MODE: PRESIGNED
      S3_PATH_STYLE_ACCESS_ENABLED: "true"
      BACKOFFICE_ADMIN_EMAILS: "gtestino1992@gmail.com"
      FIREBASE_APP_CHECK_MODE: ${FIREBASE_APP_CHECK_MODE:-DISABLED}
      FIREBASE_PROJECT_NUMBER: ${FIREBASE_PROJECT_NUMBER:-}
      FIREBASE_APP_CHECK_ALLOWED_APP_IDS: ${FIREBASE_APP_CHECK_ALLOWED_APP_IDS:-}
      MATCHMAKING_ALLOW_ACTIVE_PAIR_DUPLICATES: ${MATCHMAKING_ALLOW_ACTIVE_PAIR_DUPLICATES:-true}
      MATCHMAKING_EXCLUDE_PREVIOUS_PAIRING: ${MATCHMAKING_EXCLUDE_PREVIOUS_PAIRING:-false}
      MATCHMAKING_RANKING_MODE: ${MATCHMAKING_RANKING_MODE:-PROBABILISTIC_WEIGHTED}
      MATCHMAKING_RANKING_COMPATIBILITY_TEMPERATURE: ${MATCHMAKING_RANKING_COMPATIBILITY_TEMPERATURE:-0.20}
      MATCHMAKING_RANKING_RELIABILITY_SIMILARITY_SCALE: ${MATCHMAKING_RANKING_RELIABILITY_SIMILARITY_SCALE:-2.0}
      MATCHMAKING_RANKING_WAITING_RELAXATION_PERIOD_HOURS: ${MATCHMAKING_RANKING_WAITING_RELAXATION_PERIOD_HOURS:-72.0}
      MATCHMAKING_RANKING_MAXIMUM_SIMILARITY_SCALE_MULTIPLIER: ${MATCHMAKING_RANKING_MAXIMUM_SIMILARITY_SCALE_MULTIPLIER:-3.0}
      ENGAGEMENT_MAX_ACTIVE_MATCHES: ${ENGAGEMENT_MAX_ACTIVE_MATCHES:-100}
      ENGAGEMENT_MAX_ACTIVE_CONNECTIONS: ${ENGAGEMENT_MAX_ACTIVE_CONNECTIONS:-100}
      PROFILE_PHOTO_MODERATION_PROVIDER: ${PROFILE_PHOTO_MODERATION_PROVIDER:-none}
      SIGHTENGINE_API_USER: ${SIGHTENGINE_API_USER:-}
      SIGHTENGINE_API_SECRET: ${SIGHTENGINE_API_SECRET:-}
      PROFILE_PHOTO_SIGHTENGINE_CONNECT_TIMEOUT_MS: ${PROFILE_PHOTO_SIGHTENGINE_CONNECT_TIMEOUT_MS:-3000}
      PROFILE_PHOTO_SIGHTENGINE_READ_TIMEOUT_MS: ${PROFILE_PHOTO_SIGHTENGINE_READ_TIMEOUT_MS:-10000}

    volumes:
      - ./secrets/reals-backend-firebase-credentials-dev.json:/app/secrets/reals-backend-firebase-credentials-dev.json:ro
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16-alpine
    container_name: reals-postgres-local
    environment:
      POSTGRES_DB: reals
      POSTGRES_USER: reals
      POSTGRES_PASSWORD: reals
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - reals-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reals -d reals"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: reals-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reals
      MINIO_ROOT_PASSWORD: reals-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - reals-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: reals-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 reals reals-password; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb --ignore-existing local/reals-profile-photos;
      mc anonymous set none local/reals-profile-photos;
      "

volumes:
  reals-postgres-data:
  reals-minio-data:
