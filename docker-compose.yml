services:
  backend:
    build:
      context: .
    image: reals-backend:local
    container_name: reals-backend-local
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: local-firebase
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reals
      SPRING_DATASOURCE_USERNAME: reals
      SPRING_DATASOURCE_PASSWORD: reals
      RATE_LIMIT_ENABLED: "false"
      #RATE_LIMIT_PROVISION_CAPACITY: "1"
      #RATE_LIMIT_PROVISION_REFILL_TOKENS: "1"
      #RATE_LIMIT_PROVISION_REFILL_PERIOD_SECONDS: "60"
      S3_ENDPOINT: http://minio:9000
      S3_PRESIGNED_URL_ENDPOINT: http://192.168.0.5:9000
      S3_REGION: us-east-1
      S3_PROFILE_PHOTOS_BUCKET: reals-profile-photos
      S3_ACCESS_KEY_ID: reals
      S3_SECRET_ACCESS_KEY: reals-password
      S3_READ_URL_MODE: PRESIGNED
      S3_PATH_STYLE_ACCESS_ENABLED: "true"
      BACKOFFICE_ADMIN_EMAILS: "gtestino1992@gmail.com"

    volumes:
      - ./secrets/reals-backend-firebase-credentials-dev.json:/app/secrets/reals-backend-firebase-credentials-dev.json:ro
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16-alpine
    container_name: reals-postgres-local
    environment:
      POSTGRES_DB: reals
      POSTGRES_USER: reals
      POSTGRES_PASSWORD: reals
    ports:
      - "5432:5432"
    volumes:
      - reals-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reals -d reals"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: reals-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reals
      MINIO_ROOT_PASSWORD: reals-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - reals-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: reals-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 reals reals-password; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb --ignore-existing local/reals-profile-photos;
      mc anonymous set none local/reals-profile-photos;
      "

volumes:
  reals-postgres-data:
  reals-minio-data: