spring:
  datasource:
    url: jdbc:h2:mem:reals_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

  main:
    banner-mode: off

logging:
  level:
    root: WARN

management:
  endpoint:
    health:
      probes:
        enabled: true

scheduler:
  enabled: false
  matchmaking-job:
    fixed-delay: 3600000
    max-pairs-per-run: 10
  chat-timeout-job:
    fixed-delay: 3600000
  match-expiration-job:
    fixed-delay: 3600000
  inactivity-check-job:
    fixed-delay: 3600000
    inactivity-threshold-minutes: ${chat.first-chat.inactivity-threshold-minutes}
  penalty-expiration-job:
    fixed-delay: 3600000
  user-reliability-cleanup-job:
    fixed-delay: 3600000
  visual-phase-expiration-job:
    fixed-delay: 3600000
  scheduling-timeout-job:
    fixed-delay: 3600000
  account-deletion-finalization-job:
    fixed-delay: 3600000
  second-chat-reminder-job:
    fixed-delay: 60000

notifications:
  second-chat-reminder:
    # Comma-separated lead times in minutes.
    minutes-before: 10

account:
  deletion:
    recovery-window-days: 30

matchmaking:
  candidate-pair-limit: 5
  min-compatibility-score: 0.20
  early-accept-compatibility-score: 0.90

chat:
  first-chat:
    duration-minutes: 15
    inactivity-threshold-minutes: 5
    min-messages-per-user: 0
    min-messages-before-free-cancel: 1
  visual-phase:
    duration-minutes: 1440
  second-chat:
    duration-minutes: 120
    read-only-retention-minutes: 1440
    min-messages-before-free-cancel: 1

scheduling:
  negotiation-duration-minutes: 2880
  max-rounds: 3
  max-proposals-per-round: 3

profile:
  photos:
    max-count: 9
    required-count: 4
    min-person-photos: 1
    min-full-body-photos: 1

engagement:
  max-active-matches: 5
  max-active-connections: 2

security:
  rate-limit:
    enabled: false

storage:
  s3:
    endpoint: http://localhost:9000
    presigned-url-endpoint: http://localhost:9000
    region: us-east-1
    bucket: reals-profile-photos-test
    access-key-id: test
    secret-access-key: test
    public-base-url: http://localhost:9000/reals-profile-photos-test
    path-style-access-enabled: true
    signed-url-duration-minutes: 15
    read-url-mode: PRESIGNED
  profile-photos:
    max-size-bytes: 5242880
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
