spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      connection-timeout: 5000
      validation-timeout: 2000
      max-lifetime: 1800000
      keepalive-time: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: false

  flyway:
    enabled: true

logging:
  level:
    root: INFO

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

scheduler:
  enabled: true
  matchmaking-job:
    fixed-delay: 60000
    max-pairs-per-run: 10
  chat-timeout-job:
    fixed-delay: 120000
  match-expiration-job:
    fixed-delay: 300000
    max-chat-duration: PT24H
  inactivity-check-job:
    fixed-delay: 180000
    inactivity-threshold-minutes: 30
  penalty-expiration-job:
    fixed-delay: 600000
  visual-phase-expiration-job:
    fixed-delay: 300000
  scheduling-timeout-job:
    fixed-delay: 900000
  scheduled-second-chat-start-job:
    fixed-delay: 60000
  scheduling-activation-job:
    fixed-delay: 60000
  account-deletion-finalization-job:
    fixed-delay: 3600000

account:
  deletion:
    recovery-window-days: ${ACCOUNT_DELETION_RECOVERY_WINDOW_DAYS:30}

matchmaking:
  candidate-pair-limit: 50
  min-compatibility-score: 0.20
  early-accept-compatibility-score: 0.90

chat:
  first-chat:
    duration-minutes: 1440
    min-messages-per-user: 0
    min-messages-before-free-cancel: 0
  visual-phase:
    duration-minutes: 1440
  second-chat:
    duration-minutes: 2880
    min-messages-before-free-cancel: 0

scheduling:
  activation-delay-minutes: 5
  negotiation-duration-minutes: 2880
  max-rounds: 3
  max-proposals-per-round: 3

profile:
  photos:
    max-count: 9
    required-count: 9
    min-person-photos: 3
    min-full-body-photos: 1

engagement:
  max-active-matches: 5
  max-active-connections: 2

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}

storage:
  s3:
    endpoint: ${S3_ENDPOINT}
    presigned-url-endpoint: ${S3_PRESIGNED_URL_ENDPOINT:}
    region: ${S3_REGION:sa-east-1}
    bucket: ${S3_PROFILE_PHOTOS_BUCKET}
    access-key-id: ${S3_ACCESS_KEY_ID}
    secret-access-key: ${S3_SECRET_ACCESS_KEY}
    public-base-url: ${S3_PUBLIC_BASE_URL:}
    path-style-access-enabled: ${S3_PATH_STYLE_ACCESS_ENABLED:true}
    signed-url-duration-minutes: ${S3_SIGNED_URL_DURATION_MINUTES:15}
    read-url-mode: ${S3_READ_URL_MODE:PRESIGNED}
  profile-photos:
    max-size-bytes: ${PROFILE_PHOTO_MAX_SIZE_BYTES:5242880}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp

identity-verification:
  provider: ${IDENTITY_VERIFICATION_PROVIDER:none}
  api-key: ${IDENTITY_VERIFICATION_API_KEY:}
