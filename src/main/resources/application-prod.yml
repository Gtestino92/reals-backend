spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: false

  flyway:
    enabled: true

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

scheduler:
  enabled: true
  matchmaking-job:
    fixed-delay: 60000
    batch-size: 5
  chat-timeout-job:
    fixed-delay: 120000
  match-expiration-job:
    fixed-delay: 300000
    max-chat-duration: PT24H
  inactivity-check-job:
    fixed-delay: 180000
    inactivity-threshold-minutes: 30
  penalty-expiration-job:
    fixed-delay: 600000
  visual-phase-expiration-job:
    fixed-delay: 300000
  scheduling-timeout-job:
    fixed-delay: 900000
  scheduled-second-chat-start-job:
    fixed-delay: 60000

chat:
  first-chat:
    duration-minutes: 1440
    min-messages-per-user: 0
    min-messages-before-free-cancel: 0
  visual-phase:
    duration-minutes: 1440
  second-chat:
    duration-minutes: 2880
    min-messages-before-free-cancel: 0

scheduling:
  negotiation-duration-minutes: 2880
  max-rounds: 3
  max-proposals-per-round: 3

profile:
  photos:
    max-count: 9
    required-count: 9
    min-person-photos: 3
    min-full-body-photos: 1

engagement:
  max-active-matches: 5
  max-active-connections: 2

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

storage:
  s3:
    bucket: ${S3_PROFILE_PHOTOS_BUCKET}
    region: ${S3_REGION}
    upload-prefix: profile-photos/quarantine
    public-prefix: profile-photos/public

identity-verification:
  provider: ${IDENTITY_VERIFICATION_PROVIDER:none}
  api-key: ${IDENTITY_VERIFICATION_API_KEY:}
