spring:
  config:
    activate:
      on-profile: local-firebase

  datasource:
    url: jdbc:postgresql://postgres:5432/reals
    username: reals
    password: reals
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
      enabled: true

storage:
  provider: r2
  r2:
    endpoint: ${R2_ENDPOINT}
    region: auto
    bucket: ${R2_BUCKET}
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}
    public-base-url: ${R2_PUBLIC_BASE_URL:}
    signed-url-duration-minutes: 15
  profile-photos:
    max-size-bytes: 5242880
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
      -
logging:
  level:
    root: INFO

scheduler:
  enabled: false

matchmaking:
  candidate-pair-limit: 5
  min-compatibility-score: 0.20
  early-accept-compatibility-score: 0.90

firebase:
  service-account-path: ./secrets/reals-backend-firebase-credentials-dev.json
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}

profile:
  photos:
    max-count: 9
    required-count: 4
    min-person-photos: 1
    min-full-body-photos: 1
