spring:
  config:
    activate:
      on-profile: local-nodb

  datasource:
    url: jdbc:h2:file:./data/realsdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  flyway:
    enabled: false

logging:
  level:
    root: INFO

scheduler:
  # Local manual testing should be deterministic. Use /api/local-dev/jobs/.../run
  # endpoints from Bruno instead of background execution.
  enabled: false
  matchmaking-job:
    fixed-delay: 60000
    max-pairs-per-run: 5
  chat-timeout-job:
    fixed-delay: 60000
  second-chat-lifecycle-job:
    fixed-delay: 120000
  second-chat-reminder-job:
    fixed-delay: 60000
  match-expiration-job:
    fixed-delay: 300000
    max-chat-duration: PT20M
  inactivity-check-job:
    fixed-delay: 60000
    inactivity-threshold-minutes: ${chat.first-chat.inactivity-threshold-minutes}
  penalty-expiration-job:
    fixed-delay: 600000
  visual-phase-expiration-job:
    fixed-delay: 300000
  scheduling-timeout-job:
    fixed-delay: 900000
  scheduling-activation-job:
    fixed-delay: 60000
  account-deletion-finalization-job:
    fixed-delay: 3600000

notifications:
  second-chat-reminder:
    # Comma-separated lead times in minutes. Keep multiple values in descending
    # order for readability, for example: 120,10. Values must be positive.
    minutes-before: 10

matchmaking:
  candidate-pair-limit: 5
  min-compatibility-score: 0.20
  early-accept-compatibility-score: 0.90

profile:
  photos:
    max-count: 9
    required-count: 4
    min-person-photos: 1
    min-full-body-photos: 1
