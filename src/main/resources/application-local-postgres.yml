spring:
  config:
    activate:
      on-profile: local-postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/reals
    driver-class-name: org.postgresql.Driver
    username: reals
    password: reals
    hikari:
      connection-timeout: 5000
      validation-timeout: 2000
      max-lifetime: 1800000
      keepalive-time: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: false

  flyway:
    enabled: true

logging:
  level:
    root: INFO

management:
  endpoint:
    health:
      probes:
        enabled: true

scheduler:
  # Keep local PostgreSQL runs deterministic. Use /api/local-dev/jobs/.../run
  # endpoints from Bruno instead of background execution.
  enabled: false
  matchmaking-job:
    fixed-delay: 60000
    max-pairs-per-run: 5
  chat-timeout-job:
    fixed-delay: 60000
  second-chat-lifecycle-job:
    fixed-delay: 120000
  second-chat-reminder-job:
    fixed-delay: 60000
  visual-review-reminder-job:
    fixed-delay: 1800000
  match-expiration-job:
    fixed-delay: 300000
    max-chat-duration: PT20M
  inactivity-check-job:
    fixed-delay: 60000
    inactivity-threshold-minutes: ${chat.first-chat.inactivity-threshold-minutes}
  penalty-expiration-job:
    fixed-delay: 600000
  visual-phase-expiration-job:
    fixed-delay: 300000
  scheduling-timeout-job:
    fixed-delay: 900000
  scheduling-activation-job:
    fixed-delay: 60000
  account-deletion-finalization-job:
    fixed-delay: 3600000

notifications:
  second-chat-reminder:
    # Comma-separated lead times in minutes. Keep multiple values in descending
    # order for readability, for example: 120,10. Values must be positive.
    minutes-before: 10
  visual-review-reminder:
    remaining-percentage: 40

matchmaking:
  candidate-pair-limit: 5
  min-compatibility-score: 0.20
  early-accept-compatibility-score: 0.90
  exclude-previous-pairing: false
  previous-pairing-cooldown-days: 30
  first-chat-expiration-cooldown-days: 7

profile:
  photos:
    max-count: 9
    required-count: 4
    min-person-photos: 1
    min-full-body-photos: 1

chat:
  audio:
    enabled: true
  first-chat:
    audio:
      required-answered-guidance-questions: 1
