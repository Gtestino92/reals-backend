# Helm values reference for the prod environment.
#
# This documents the app-specific values a future chart or deploy pipeline
# would consume. The final deploy convention is tracked in docs/technical-debt-mvp and docs/technical-debt-prod.md.
# Do not put real secret values here.

environment: prod

image:
  repository: ghcr.io/gtestino92/reals-backend
  tag: vX.Y.Z
  pullPolicy: IfNotPresent

replicaCount: 2

serviceAccount:
  create: true
  name: reals-backend-prod
  annotations: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: api.reals.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: reals-backend-tls
      hosts:
        - api.reals.example.com

resources:
  requests:
    cpu: 500m
    memory: 1024Mi
  limits:
    cpu: 2000m
    memory: 2048Mi

probes:
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

env:
  - name: SPRING_PROFILES_ACTIVE
    value: prod
  - name: FIREBASE_APP_CHECK_MODE
    value: ENFORCED

configRefs:
  - name: DATABASE_URL
    key: database_url
  - name: DATABASE_USERNAME
    key: database_username
  - name: FIREBASE_PROJECT_NUMBER
    key: firebase_project_number
  - name: FIREBASE_APP_CHECK_ALLOWED_APP_IDS
    key: firebase_app_check_allowed_app_ids
  - name: STORAGE_S3_BUCKET
    key: reals-prod-media
  - name: PROFILE_AUTHENTICITY_VERIFICATION_PROVIDER
    key: profile-authenticity-verification-provider

secretRefs:
  - name: DATABASE_PASSWORD
    key: database_password
  - name: FIREBASE_SERVICE_ACCOUNT_BASE64
    key: firebase_service_account_base64
  - name: PROFILE_AUTHENTICITY_VERIFICATION_API_KEY
    key: profile_authenticity_verification_api_key
