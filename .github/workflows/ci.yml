name: CI

on:
  pull_request:
    branches:
      - master
      - development
  push:
    branches:
      - master
      - development

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run tests
        run: ./mvnw clean test

  docker-validate:
    name: Validate Docker image
    runs-on: ubuntu-latest
    needs: test
    env:
      TRIVY_DISABLE_VEX_NOTICE: "true"
      TRIVY_SKIP_VERSION_CHECK: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose config
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build -t reals-backend:ci .

      - name: Scan backend image for critical vulnerabilities
        id: trivy_dev
        if: github.ref_name != 'master' && github.base_ref != 'master'
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: reals-backend:ci
          format: table
          exit-code: "1"
          scanners: vuln
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          output: trivy-results.txt

      - name: Scan backend image for high and critical vulnerabilities
        id: trivy_prod
        if: github.ref_name == 'master' || github.base_ref == 'master'
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: reals-backend:ci
          format: table
          exit-code: "1"
          scanners: vuln
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          output: trivy-results.txt

      - name: Publish Trivy summary
        if: always()
        shell: bash
        run: |
          if [ -f trivy-results.txt ]; then
            {
              echo "### Trivy image scan"
              echo
              echo '```text'
              cat trivy-results.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce Trivy policy
        if: steps.trivy_dev.outcome == 'failure' || steps.trivy_prod.outcome == 'failure'
        run: |
          echo "Trivy image scan failed. See the job summary for the vulnerability table."
          exit 1

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  publish-image:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs:
      - test
      - docker-validate
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        shell: bash
        run: |
          IMAGE_OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${IMAGE_OWNER}/reals-backend"
          BRANCH_TAG="$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
          SHORT_SHA="${GITHUB_SHA::7}"

          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:${BRANCH_TAG}" \
            -t "${IMAGE}:sha-${SHORT_SHA}" \
            .

          docker push "${IMAGE}:${BRANCH_TAG}"
          docker push "${IMAGE}:sha-${SHORT_SHA}"

          if [ "$GITHUB_REF_NAME" = "master" ]; then
            docker tag "${IMAGE}:${BRANCH_TAG}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          fi
