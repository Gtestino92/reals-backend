name: CI

on:
  pull_request:
    branches:
      - master
      - development
  push:
    branches:
      - master
      - development

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run tests
        run: ./mvnw clean test

  publish-image:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        shell: bash
        run: |
          IMAGE_OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${IMAGE_OWNER}/reals-backend"
          BRANCH_TAG="$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
          SHORT_SHA="${GITHUB_SHA::7}"

          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:${BRANCH_TAG}" \
            -t "${IMAGE}:sha-${SHORT_SHA}" \
            .

          docker push "${IMAGE}:${BRANCH_TAG}"
          docker push "${IMAGE}:sha-${SHORT_SHA}"

          if [ "$GITHUB_REF_NAME" = "master" ]; then
            docker tag "${IMAGE}:${BRANCH_TAG}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          fi
