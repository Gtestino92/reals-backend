name: CI

on:
  pull_request:
    branches:
      - master
      - development
  push:
    branches:
      - master
      - development

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Bruno request variables
        run: python scripts/check_bruno_request_vars.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run tests
        run: ./mvnw test

  docker-validate:
    name: Validate Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    env:
      TRIVY_DISABLE_VEX_NOTICE: "true"
      TRIVY_SKIP_VERSION_CHECK: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Compose config
        run: docker compose config --quiet

      - name: Validate AWS deployment scripts
        shell: bash
        run: |
          bash -n ops/aws/deploy-backend.sh
          bash -n ops/aws/test-deploy-backend.sh
          ops/aws/test-deploy-backend.sh

      - name: Prepare Docker image metadata
        id: image_meta
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${IMAGE_OWNER}/reals-backend"
          BRANCH_TAG="$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            IMAGE_REPOSITORY="${IMAGE}"
            IMAGE_TAG="${BRANCH_TAG}"
          else
            IMAGE_REPOSITORY="reals-backend"
            IMAGE_TAG="ci"
          fi

          {
            echo "image=${IMAGE}"
            echo "image_repository=${IMAGE_REPOSITORY}"
            echo "image_tag=${IMAGE_TAG}"
            echo "branch_tag=${BRANCH_TAG}"
            echo "short_sha=${SHORT_SHA}"
            echo "tags<<EOF"
            echo "reals-backend:ci"
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "${IMAGE}:${BRANCH_TAG}"
              echo "${IMAGE}:sha-${SHORT_SHA}"
              if [[ "$GITHUB_REF_NAME" == "master" ]]; then
                echo "${IMAGE}:latest"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          build-args: |
            IMAGE_REPOSITORY=${{ steps.image_meta.outputs.image_repository }}
            IMAGE_TAG=${{ steps.image_meta.outputs.image_tag }}
            IMAGE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.image_meta.outputs.tags }}
          cache-from: type=gha,scope=reals-backend
          cache-to: type=gha,scope=reals-backend,mode=max

      - name: Scan backend image for critical vulnerabilities
        id: trivy_dev
        if: github.ref_name != 'master' && github.base_ref != 'master'
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: reals-backend:ci
          format: table
          exit-code: "1"
          scanners: vuln
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          output: trivy-results.txt

      - name: Scan backend image for high and critical vulnerabilities
        id: trivy_prod
        if: github.ref_name == 'master' || github.base_ref == 'master'
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: reals-backend:ci
          format: table
          exit-code: "1"
          scanners: vuln
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          output: trivy-results.txt

      - name: Publish Trivy summary
        if: always()
        shell: bash
        run: |
          if [ -f trivy-results.txt ]; then
            {
              echo "### Trivy image scan"
              echo
              echo '```text'
              cat trivy-results.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce Trivy policy
        if: steps.trivy_dev.outcome == 'failure' || steps.trivy_prod.outcome == 'failure'
        run: |
          echo "Trivy image scan failed. See the job summary for the vulnerability table."
          exit 1

      - name: Log in to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push validated image
        if: github.event_name == 'push'
        shell: bash
        env:
          IMAGE: ${{ steps.image_meta.outputs.image }}
          BRANCH_TAG: ${{ steps.image_meta.outputs.branch_tag }}
          SHORT_SHA: ${{ steps.image_meta.outputs.short_sha }}
        run: |
          set -euo pipefail

          VALIDATED_IMAGE_ID="$(docker image inspect --format '{{ .Id }}' reals-backend:ci)"

          for tag in "${IMAGE}:${BRANCH_TAG}" "${IMAGE}:sha-${SHORT_SHA}"; do
            TAG_IMAGE_ID="$(docker image inspect --format '{{ .Id }}' "$tag")"
            if [[ "$TAG_IMAGE_ID" != "$VALIDATED_IMAGE_ID" ]]; then
              echo "Refusing to push ${tag}: tag does not reference the scanned local image." >&2
              exit 1
            fi
            docker push "$tag"
          done

          if [[ "$GITHUB_REF_NAME" == "master" ]]; then
            LATEST_IMAGE_ID="$(docker image inspect --format '{{ .Id }}' "${IMAGE}:latest")"
            if [[ "$LATEST_IMAGE_ID" != "$VALIDATED_IMAGE_ID" ]]; then
              echo "Refusing to push ${IMAGE}:latest: tag does not reference the scanned local image." >&2
              exit 1
            fi
            docker push "${IMAGE}:latest"
          fi

      - name: Verify pushed tag digests
        if: github.event_name == 'push'
        shell: bash
        env:
          IMAGE: ${{ steps.image_meta.outputs.image }}
          BRANCH_TAG: ${{ steps.image_meta.outputs.branch_tag }}
          SHORT_SHA: ${{ steps.image_meta.outputs.short_sha }}
        run: |
          set -euo pipefail

          digest_for() {
            docker buildx imagetools inspect "$1" | awk '/^Digest:/ { print $2; exit }'
          }

          branch_digest="$(digest_for "${IMAGE}:${BRANCH_TAG}")"
          sha_digest="$(digest_for "${IMAGE}:sha-${SHORT_SHA}")"

          if [[ "$branch_digest" != "$sha_digest" ]]; then
            echo "Published branch and immutable SHA tags resolved to different digests." >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" == "master" ]]; then
            latest_digest="$(digest_for "${IMAGE}:latest")"
            if [[ "$latest_digest" != "$sha_digest" ]]; then
              echo "Published latest and immutable SHA tags resolved to different digests." >&2
              exit 1
            fi
          fi

          {
            echo "### Published image"
            echo
            echo "| Tag | Digest |"
            echo "| --- | --- |"
            echo "| ${IMAGE}:${BRANCH_TAG} | ${branch_digest} |"
            echo "| ${IMAGE}:sha-${SHORT_SHA} | ${sha_digest} |"
            if [[ "$GITHUB_REF_NAME" == "master" ]]; then
              echo "| ${IMAGE}:latest | ${latest_digest} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

      - name: Dependency review not required on push
        if: github.event_name != 'pull_request'
        run: echo "Dependency review is pull-request-only; required check reports success for push events."
