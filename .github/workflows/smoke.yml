name: Smoke check

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to check, for example https://api-dev.example.com"
        required: true
        type: string
      expected_image_repository:
        description: "Optional expected image repository embedded in the image"
        required: false
        default: "ghcr.io/gtestino92/reals-backend"
        type: string
      expected_image_tag:
        description: "Optional expected GHCR image tag embedded in the image, for example development"
        required: false
        type: string
      expected_image_revision:
        description: "Optional expected Git commit SHA embedded in the image"
        required: false
        type: string

permissions: {}

jobs:
  smoke:
    name: Check deployed backend
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Normalize inputs
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${{ inputs.base_url }}"
          BASE_URL="${BASE_URL%/}"

          if [[ ! "$BASE_URL" =~ ^https?:// ]]; then
            echo "base_url must start with http:// or https://, got: $BASE_URL" >&2
            exit 1
          fi

          {
            echo "BASE_URL=${BASE_URL}"
            echo "EXPECTED_IMAGE_REPOSITORY=${{ inputs.expected_image_repository }}"
            echo "EXPECTED_IMAGE_TAG=${{ inputs.expected_image_tag }}"
            echo "EXPECTED_IMAGE_REVISION=${{ inputs.expected_image_revision }}"
          } >> "$GITHUB_ENV"

      - name: Check readiness
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --show-error --silent \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --max-time 10 \
            "${BASE_URL}/actuator/health/readiness" \
            | tee readiness.json

          python - <<'PY'
          import json

          with open("readiness.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          status = payload.get("status")
          if status != "UP":
              raise SystemExit(f"Expected readiness status UP, got {status!r}")
          PY

      - name: Check actuator info
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --show-error --silent \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --max-time 10 \
            "${BASE_URL}/actuator/info" \
            | tee info.json

          python - <<'PY'
          import json
          import os

          expected_repository = os.environ.get("EXPECTED_IMAGE_REPOSITORY", "").strip()
          expected_tag = os.environ.get("EXPECTED_IMAGE_TAG", "").strip()
          expected_revision = os.environ.get("EXPECTED_IMAGE_REVISION", "").strip()

          with open("info.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          image = payload.get("image") or {}
          actual_repository = image.get("repository") or ""
          actual_tag = image.get("tag") or ""
          actual_revision = image.get("revision") or ""

          with open("image-metadata.env", "w", encoding="utf-8") as handle:
              handle.write(f"ACTUAL_IMAGE_REPOSITORY={actual_repository}\n")
              handle.write(f"ACTUAL_IMAGE_TAG={actual_tag}\n")
              handle.write(f"ACTUAL_IMAGE_REVISION={actual_revision}\n")

          if expected_repository and actual_repository != expected_repository:
              raise SystemExit(
                  "Expected image.repository "
                  f"{expected_repository!r}, got {actual_repository!r}"
              )

          if expected_tag and actual_tag != expected_tag:
              raise SystemExit(
                  f"Expected image.tag {expected_tag!r}, got {actual_tag!r}"
              )

          if expected_revision:
              revision_matches = (
                  actual_revision == expected_revision
                  or actual_revision.startswith(expected_revision)
              )
              if not revision_matches:
                  raise SystemExit(
                      "Expected image.revision "
                      f"{expected_revision!r}, got {actual_revision!r}"
                  )
          PY

          cat image-metadata.env >> "$GITHUB_ENV"

      - name: Check ping
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --show-error --silent \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --max-time 10 \
            "${BASE_URL}/api/ping" \
            | tee ping.json

          python - <<'PY'
          import json

          with open("ping.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          status = payload.get("status")
          if status != "ok":
              raise SystemExit(f"Expected ping status ok, got {status!r}")
          PY

      - name: Publish smoke summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "### Smoke check"
            echo
            echo "| Check | Target |"
            echo "| --- | --- |"
            echo "| Base URL | ${BASE_URL:-} |"
            echo "| Readiness | /actuator/health/readiness |"
            echo "| Info | /actuator/info |"
            echo "| Ping | /api/ping |"

            if [ -n "${ACTUAL_IMAGE_REPOSITORY:-}" ]; then
              echo "| Actual image repository | ${ACTUAL_IMAGE_REPOSITORY} |"
            fi

            if [ -n "${ACTUAL_IMAGE_TAG:-}" ]; then
              echo "| Actual image tag | ${ACTUAL_IMAGE_TAG} |"
            fi

            if [ -n "${ACTUAL_IMAGE_REVISION:-}" ]; then
              echo "| Actual image revision | ${ACTUAL_IMAGE_REVISION} |"
            fi

            if [ -n "${EXPECTED_IMAGE_REPOSITORY:-}" ]; then
              echo "| Expected image repository | ${EXPECTED_IMAGE_REPOSITORY} |"
            fi

            if [ -n "${EXPECTED_IMAGE_TAG:-}" ]; then
              echo "| Expected image tag | ${EXPECTED_IMAGE_TAG} |"
            fi

            if [ -n "${EXPECTED_IMAGE_REVISION:-}" ]; then
              echo "| Expected image revision | ${EXPECTED_IMAGE_REVISION} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
