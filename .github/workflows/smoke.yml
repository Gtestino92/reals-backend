name: Smoke check

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to check, for example https://api-dev.example.com"
        required: true
        type: string

permissions: {}

jobs:
  smoke:
    name: Check deployed backend
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Normalize inputs
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${{ inputs.base_url }}"
          BASE_URL="${BASE_URL%/}"

          if [[ ! "$BASE_URL" =~ ^https?:// ]]; then
            echo "base_url must start with http:// or https://, got: $BASE_URL" >&2
            exit 1
          fi

          echo "BASE_URL=${BASE_URL}" >> "$GITHUB_ENV"

      - name: Check readiness
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --show-error --silent \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --max-time 10 \
            "${BASE_URL}/actuator/health/readiness" \
            | tee readiness.json

          python - <<'PY'
          import json

          with open("readiness.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          status = payload.get("status")
          if status != "UP":
              raise SystemExit(f"Expected readiness status UP, got {status!r}")
          PY

      - name: Check ping
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --show-error --silent \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --max-time 10 \
            "${BASE_URL}/api/ping" \
            | tee ping.json

          python - <<'PY'
          import json

          with open("ping.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          status = payload.get("status")
          if status != "ok":
              raise SystemExit(f"Expected ping status ok, got {status!r}")
          PY

      - name: Publish smoke summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "### Smoke check"
            echo
            echo "| Check | Target |"
            echo "| --- | --- |"
            echo "| Base URL | ${BASE_URL:-} |"
            echo "| Readiness | /actuator/health/readiness |"
            echo "| Ping | /api/ping |"
          } >> "$GITHUB_STEP_SUMMARY"
